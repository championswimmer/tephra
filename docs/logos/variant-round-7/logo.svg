<title id="title">Tephra — Volcanic Glass Bloom</title>
<desc id="desc">A broad two-tone purple ash cloud above a narrow volcanic rock. Irregular shoulders, a summit crater, and long gradient glass facets combine a volcanic mountain with a chipped obsidian-like stone.</desc>

