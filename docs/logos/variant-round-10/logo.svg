<title id="title">Tephra — Glass Bloom</title>
<desc id="desc">A playful three-tone purple cloud and a compact volcanic rock form a T-like silhouette. Slightly broader lower ash shoulders and a narrower seven-facet mountain give the vertical stem more consistent proportions.</desc>




