# Compose bundle for a GCP Compute Engine VM (disk-only, single tenant).
# The PD is mounted at /data by gce-startup.sh. One tenant = one VM + one disk.
# Optional headless Sync sidecar (plan 006) mounts the same /data volume.
services:
  tephra:
    image: <REGION>-docker.pkg.dev/<PROJECT>/<REPO>/tephra:<TAG>
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      PORT: '8080'
      HOST: '0.0.0.0'
      TEPHRA_PUBLIC_URL: '${TEPHRA_PUBLIC_URL:?set TEPHRA_PUBLIC_URL}'
      TEPHRA_SESSION_SECRET: '${TEPHRA_SESSION_SECRET:?set TEPHRA_SESSION_SECRET}'
      TEPHRA_BOOTSTRAP_TOKEN: '${TEPHRA_BOOTSTRAP_TOKEN:-}'
      TEPHRA_DATABASE_DRIVER: 'sqlite'
      TEPHRA_SQLITE_PATH: '/data/tephra.db'
      TEPHRA_BLOB_DRIVER: 'filesystem'
      TEPHRA_BLOB_PATH: '/data/blobs'
      TEPHRA_MAX_BLOB_BYTES: '${TEPHRA_MAX_BLOB_BYTES:-104857600}'
    volumes:
      - /data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
