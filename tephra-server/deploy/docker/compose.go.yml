# Go server variant. Same environment and data volume layout as compose.yml, so the two are
# interchangeable on one volume (run only one at a time).
#   docker compose -f tephra-server/deploy/docker/compose.go.yml up --build
# Set WITH_OBSIDIAN_SYNC=true to include Node for official Obsidian headless sync.
services:
  tephra:
    build:
      context: ../../..
      dockerfile: tephra-server/deploy/docker/Dockerfile.go
      args:
        WITH_OBSIDIAN_SYNC: '${WITH_OBSIDIAN_SYNC:-false}'
    image: tephra:go-local
    restart: unless-stopped
    init: true
    ports:
      - '${TEPHRA_PORT:-8080}:8080'
    environment:
      PORT: '8080'
      HOST: '0.0.0.0'
      TEPHRA_PUBLIC_URL: '${TEPHRA_PUBLIC_URL:-http://localhost:8080}'
      TEPHRA_BOOTSTRAP_TOKEN: '${TEPHRA_BOOTSTRAP_TOKEN:?set TEPHRA_BOOTSTRAP_TOKEN}'
      TEPHRA_DATABASE_DRIVER: 'sqlite'
      TEPHRA_SQLITE_PATH: '/data/tephra.db'
      TEPHRA_BLOB_DRIVER: 'filesystem'
      TEPHRA_BLOB_PATH: '/data/blobs'
      TEPHRA_MAX_BLOB_BYTES: '${TEPHRA_MAX_BLOB_BYTES:-104857600}'
      TEPHRA_OBSIDIAN_SYNC_ENABLED: '${WITH_OBSIDIAN_SYNC:-false}'
    volumes:
      - tephra-data:/data
    healthcheck:
      test: ['CMD', '/usr/local/bin/tephra-server', 'healthcheck']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  tephra-data:
