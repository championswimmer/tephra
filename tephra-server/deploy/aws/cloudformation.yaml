AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Tephra on one EC2 instance in the default VPC: encrypted EBS volume at /data,
  Elastic IP, Caddy for HTTPS. Secrets are generated by Secrets Manager and
  fetched by the instance at boot (never in user-data).

Parameters:
  DomainName:
    Type: String
    Description: Hostname you will point at the Elastic IP, e.g. notes.example.com
    AllowedPattern: '^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$'
  InstanceType:
    Type: String
    Default: t3.small
  DataVolumeGiB:
    Type: Number
    Default: 20
    MinValue: 8
  RepoUrl:
    Type: String
    Default: https://github.com/championswimmer/tephra.git
    Description: Public git repo the instance clones and builds the image from
  AmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  Secrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Tephra session secret and one-time bootstrap token
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: TEPHRA_SESSION_SECRET
        PasswordLength: 64
        ExcludePunctuation: true
        ExcludeUppercase: true

  BootstrapSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Tephra one-time bootstrap token (delete after first setup)
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
        ExcludeUppercase: true

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-tephra-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref Secrets, !Ref BootstrapSecret]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Tephra HTTP/HTTPS only (no SSH)
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2 }
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 16, VolumeType: gp3 }
        - DeviceName: /dev/sdf
          Ebs:
            VolumeSize: !Ref DataVolumeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
      Tags:
        - { Key: Name, Value: !Sub 'tephra-${DomainName}' }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          apt-get update && apt-get install -y docker.io docker-compose-v2 git jq
          snap install aws-cli --classic
          DEV=/dev/nvme1n1; [ -b $DEV ] || DEV=/dev/sdf
          blkid $DEV || mkfs.ext4 -L tephra-data $DEV
          mkdir -p /data && echo 'LABEL=tephra-data /data ext4 defaults,nofail 0 2' >> /etc/fstab && mount -a
          mkdir -p /data/tephra /opt/tephra && chown 1000:1000 /data/tephra
          git clone --depth 1 ${RepoUrl} /opt/tephra/src
          docker build -f /opt/tephra/src/tephra-server/deploy/docker/Dockerfile -t tephra:local /opt/tephra/src
          umask 077
          {
            echo "TEPHRA_PUBLIC_URL=https://${DomainName}"
            echo "TEPHRA_SESSION_SECRET=$(aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${Secrets} --query SecretString --output text | jq -r .TEPHRA_SESSION_SECRET)"
            echo "TEPHRA_BOOTSTRAP_TOKEN=$(aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${BootstrapSecret} --query SecretString --output text | jq -r .password)"
          } > /opt/tephra/.env
          umask 022
          cat > /opt/tephra/compose.yml <<'YML'
          services:
            tephra:
              image: tephra:local
              restart: unless-stopped
              init: true
              env_file: .env
              environment:
                PORT: '8080'
                HOST: '0.0.0.0'
                TEPHRA_DATABASE_DRIVER: sqlite
                TEPHRA_SQLITE_PATH: /data/tephra.db
                TEPHRA_BLOB_DRIVER: filesystem
                TEPHRA_BLOB_PATH: /data/blobs
              volumes:
                - /data/tephra:/data
            caddy:
              image: caddy:2
              restart: unless-stopped
              ports: ['80:80', '443:443']
              command: caddy reverse-proxy --from ${DomainName} --to tephra:8080
              volumes:
                - caddy:/data
          volumes:
            caddy:
          YML
          cd /opt/tephra && docker compose up -d

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

Outputs:
  ElasticIp:
    Description: Create DNS A record  DomainName -> this IP
    Value: !Ref ElasticIp
  SetupUrl:
    Description: Open after DNS resolves (allow ~5 min for the image build)
    Value: !Sub 'https://${DomainName}/setup'
  BootstrapTokenCommand:
    Description: Print the one-time setup token
    Value: !Sub >-
      aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${BootstrapSecret} --query SecretString --output text | jq -r .password
