name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f tephra-server/deploy/docker/Dockerfile -t tephra:ci .

      - name: Smoke test container health endpoints
        run: |
          set -euo pipefail
          export TEPHRA_SESSION_SECRET="$(openssl rand -hex 32)"
          docker run -d --name tephra-ci \
            -p 8080:8080 \
            -v tephra-ci-data:/data \
            -e TEPHRA_PUBLIC_URL=http://localhost:8080 \
            -e TEPHRA_SESSION_SECRET="$TEPHRA_SESSION_SECRET" \
            tephra:ci
          cleanup() {
            docker stop tephra-ci >/dev/null 2>&1 || true
            docker rm tephra-ci >/dev/null 2>&1 || true
            docker volume rm tephra-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/healthz >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Container did not become healthy in time"
              docker logs tephra-ci || true
              exit 1
            fi
            sleep 2
          done
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8080/readyz

  web-e2e:
    name: Web end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps
        working-directory: tephra-server/apps/web

      - name: Run Playwright end-to-end tests
        run: npm run test:e2e --workspace=@tephra/web
